services:

  identity.api:
    build:
      context: .
      dockerfile: MicroNotify.Identity.API/Dockerfile
    ports:
      - "5001:8080"
    depends_on:
      - sqlserver

  notification.api:
    build:
      context: .
      dockerfile: MicroNotify.Notification.API/Dockerfile
    ports:
      - "5002:8080"
    depends_on:
      - sqlserver
      - rabbitmq

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "Your_password123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
