syntax = "proto3";

option csharp_namespace = "MicroNotify.Identity.API.Protos";

package user;

service UserService {
  rpc GetUserById (GetUserRequest) returns (UserResponse);
}

message GetUserRequest {
  string userId = 1;
}

message UserResponse {
  string id = 1;
  string email = 2;
  string fullName = 3;
  bool isActive = 4;
}
